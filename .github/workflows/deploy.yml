name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_DIR: terraform
  TF_STATE_BUCKET_NAME: touch-scrolling-web-app-terraform-state-eu-central-1
  TF_STATE_DYNAMODB_TABLE_NAME: touch-scrolling-web-app-terraform-state-locks

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    outputs:
      terraform_frontend_bucket_name: ${{ steps.tf_outputs.outputs.terraform_frontend_bucket_name }}
      terraform_cloudfront_distribution_id: ${{ steps.tf_outputs.outputs.terraform_cloudfront_distribution_id }}
      terraform_appsync_graphql_url: ${{ steps.tf_outputs.outputs.terraform_appsync_graphql_url }}
      terraform_appsync_api_key: ${{ steps.tf_outputs.outputs.terraform_appsync_api_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform remote state exists
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail

          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET_NAME" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET_NAME" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi

          if ! aws dynamodb describe-table --table-name "$TF_STATE_DYNAMODB_TABLE_NAME" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$TF_STATE_DYNAMODB_TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$TF_STATE_DYNAMODB_TABLE_NAME"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="key=${{ env.TF_DIR }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${TF_STATE_DYNAMODB_TABLE_NAME}"

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      - name: Read Terraform Outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "terraform_frontend_bucket_name=$(terraform output -raw terraform_frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "terraform_cloudfront_distribution_id=$(terraform output -raw terraform_cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "terraform_appsync_graphql_url=$(terraform output -raw terraform_appsync_graphql_url)" >> "$GITHUB_OUTPUT"
          echo "terraform_appsync_api_key=$(terraform output -raw terraform_appsync_api_key)" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write frontend backend config
        env:
          APPSYNC_GRAPHQL_URL: ${{ needs.terraform-apply.outputs.terraform_appsync_graphql_url }}
          APPSYNC_API_KEY: ${{ needs.terraform-apply.outputs.terraform_appsync_api_key }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: node scripts/write-amplify-outputs.mjs

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifacts
        run: |
          aws s3 sync build/ s3://${{ needs.terraform-apply.outputs.terraform_frontend_bucket_name }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.terraform-apply.outputs.terraform_cloudfront_distribution_id }} --paths "/*"
