name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_DIR: terraform

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    outputs:
      terraform_bucket_name: ${{ steps.tf_outputs.outputs.terraform_bucket_name }}
      terraform_distribution_id: ${{ steps.tf_outputs.outputs.terraform_distribution_id }}
      terraform_appsync_graphql_url: ${{ steps.tf_outputs.outputs.terraform_appsync_graphql_url }}
      terraform_appsync_api_key: ${{ steps.tf_outputs.outputs.terraform_appsync_api_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      - name: Read Terraform Outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "terraform_bucket_name=$(terraform output -raw terraform_frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "terraform_distribution_id=$(terraform output -raw terraform_cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "terraform_appsync_graphql_url=$(terraform output -raw terraform_appsync_graphql_url)" >> "$GITHUB_OUTPUT"
          echo "terraform_appsync_api_key=$(terraform output -raw terraform_appsync_api_key)" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write frontend backend config
        env:
          APPSYNC_GRAPHQL_URL: ${{ needs.terraform-apply.outputs.terraform_appsync_graphql_url }}
          APPSYNC_API_KEY: ${{ needs.terraform-apply.outputs.terraform_appsync_api_key }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: node scripts/write-amplify-outputs.mjs

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifacts
        run: |
          aws s3 sync build/ s3://${{ needs.terraform-apply.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.terraform-apply.outputs.distribution_id }} --paths "/*"
