name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_DIR: terraform

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    outputs:
      terraform_bucket_name: ${{ steps.tf_outputs.outputs.terraform_bucket_name }}
      terraform_distribution_id: ${{ steps.tf_outputs.outputs.terraform_distribution_id }}
      terraform_appsync_graphql_url: ${{ steps.tf_outputs.outputs.terraform_appsync_graphql_url }}
      terraform_appsync_api_key: ${{ steps.tf_outputs.outputs.terraform_appsync_api_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Import existing Terraform-managed AWS resources
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail

          account_id=$(aws sts get-caller-identity --query Account --output text)
          project_name=$(terraform console <<'EOF'
var.project_name
EOF
)
          bucket_name=$(terraform console <<'EOF'
local.effective_bucket
EOF
)
          create_oidc=$(terraform console <<'EOF'
var.create_github_oidc_provider
EOF
)

          state_list=$(terraform state list 2>/dev/null || true)
          state_has() {
            printf '%s\n' "$state_list" | grep -qx "$1"
          }

          try_import() {
            addr="$1"
            id="$2"
            if state_has "$addr"; then
              echo "Skipping import for $addr because it is already in state"
              return 0
            fi
            if [ -z "$id" ] || [ "$id" = "None" ]; then
              echo "Skipping import for $addr because no remote ID was found"
              return 0
            fi
            echo "Importing $addr => $id"
            terraform import "$addr" "$id"
          }

          try_import aws_iam_role.github_actions_deploy "${project_name}-github-actions-deploy"
          try_import aws_dynamodb_table.participant "${project_name}-participant"
          try_import aws_dynamodb_table.result "${project_name}-result"
          try_import aws_iam_role.next_parameter_set_lambda "${project_name}-next-parameter-set-lambda-role"
          try_import aws_iam_role.appsync_ddb_role "${project_name}-appsync-ddb-role"
          try_import aws_iam_role.appsync_lambda_role "${project_name}-appsync-lambda-role"

          if [ "$create_oidc" = "true" ]; then
            oidc_provider_arn="arn:aws:iam::${account_id}:oidc-provider/token.actions.githubusercontent.com"
            try_import aws_iam_openid_connect_provider.github[0] "$oidc_provider_arn"
          fi

          try_import aws_s3_bucket.frontend "$bucket_name"

          cloudfront_oac_id=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='${project_name}-oac'].Id | [0]" --output text)
          try_import aws_cloudfront_origin_access_control.frontend "$cloudfront_oac_id"

          distribution_id=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[0].DomainName=='${bucket_name}.s3.${{ env.AWS_REGION }}.amazonaws.com'].Id | [0]" --output text)
          try_import aws_cloudfront_distribution.frontend "$distribution_id"

          appsync_id=$(aws appsync list-graphql-apis --query "graphqlApis[?name=='${project_name}-api'].apiId | [0]" --output text)
          try_import aws_appsync_graphql_api.api "$appsync_id"

          if [ -n "$appsync_id" ] && [ "$appsync_id" != "None" ]; then
            api_key_id=$(aws appsync list-api-keys --api-id "$appsync_id" --query 'apiKeys[0].id' --output text)
            try_import aws_appsync_api_key.api_key "$appsync_id:$api_key_id"
          fi

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      - name: Read Terraform Outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "terraform_bucket_name=$(terraform output -raw terraform_frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "terraform_distribution_id=$(terraform output -raw terraform_cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "terraform_appsync_graphql_url=$(terraform output -raw terraform_appsync_graphql_url)" >> "$GITHUB_OUTPUT"
          echo "terraform_appsync_api_key=$(terraform output -raw terraform_appsync_api_key)" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write frontend backend config
        env:
          APPSYNC_GRAPHQL_URL: ${{ needs.terraform-apply.outputs.terraform_appsync_graphql_url }}
          APPSYNC_API_KEY: ${{ needs.terraform-apply.outputs.terraform_appsync_api_key }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: node scripts/write-amplify-outputs.mjs

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifacts
        run: |
          aws s3 sync build/ s3://${{ needs.terraform-apply.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.terraform-apply.outputs.distribution_id }} --paths "/*"
