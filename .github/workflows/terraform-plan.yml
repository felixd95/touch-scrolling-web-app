name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - terraform/**
      - .github/workflows/terraform-plan.yml
      - .github/workflows/deploy.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_DIR: terraform
  TF_STATE_BUCKET_NAME: touch-scrolling-web-app-terraform-state-eu-central-1
  TF_STATE_DYNAMODB_TABLE_NAME: touch-scrolling-web-app-terraform-state-locks

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform remote state exists
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail

          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET_NAME" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET_NAME" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi

          if ! aws dynamodb describe-table --table-name "$TF_STATE_DYNAMODB_TABLE_NAME" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$TF_STATE_DYNAMODB_TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$TF_STATE_DYNAMODB_TABLE_NAME"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="key=${{ env.TF_DIR }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${TF_STATE_DYNAMODB_TABLE_NAME}"

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false
